<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝福便签</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #eee;
            min-height:100vh;
        }
        #startBtn{
            margin:40px;
            font-size:22px;
            padding:14px 30px;
            cursor:pointer;
        }
        .note {
            position: absolute;
            width:150px;
            height:80px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:"微软雅黑",sans‑serif;
            font-size:16px;
            text-align:center;
            box-shadow:2px 2px 7px #bbbbbb;
            border-radius:5px;
        }
    </style>
</head>
<body>
    <button id="startBtn">✨点击加载祝福便签</button>

<script>
// 文案（和python原版完全一样）
const tips = [
    "际霖学业有成", "际霖好好爱自己", "际霖好好吃饭", "际霖保持好心情",
    "际霖身体健康", "际霖顺顺利利", "际霖别熬夜", "际霖天凉了多穿衣服",
    "际霖天天开心", "际霖万事胜意", "际霖平安喜乐", "际霖心想事成",
    "际霖多喝水", "际霖早点休息", "际霖加油呀", "际霖你超棒的",
    "际霖烦恼全消", "际霖好运连连", "际霖按时吃饭", "际霖少玩手机"
];
//背景颜色列表
const colors = [
    "pink", "lightblue", "lightgreen", "lemonchiffon",
    "hotpink", "skyblue", "palegreen", "lavender",
    "peachpuff", "lightcyan", "honeydew", "mistyrose"
];
const POPUP_COUNT = 200;
const WIN_WIDTH = 150;
const WIN_HEIGHT = 80;

//清空全部便签（按空格键）
function clearAllNotes(){
    document.querySelectorAll(".note").forEach(item=>item.remove());
}

//生成单张便签
function createNote(){
    const pageW = window.innerWidth;
    const pageH = window.innerHeight;
    let rx = Math.floor(Math.random() * (pageW - WIN_WIDTH));
    let ry = Math.floor(Math.random() * (pageH - WIN_HEIGHT));
    let bgColor = colors[Math.floor(Math.random()*colors.length)];
    let text = tips[Math.floor(Math.random()*tips.length)];

    let div = document.createElement("div");
    div.classList.add("note");
    div.style.left = rx + "px";
    div.style.top = ry + "px";
    div.style.backgroundColor = bgColor;
    div.innerText = text;
    document.body.appendChild(div);
}

//延时逐个生成便签，复刻原来动画效果
function spawnLoop(remaining, delayMs=60){
    if(remaining <=0) return;
    createNote();
    setTimeout(()=>{
        spawnLoop(remaining - 1, delayMs);
    }, delayMs);
}

//点击按钮开始生成
document.getElementById("startBtn").addEventListener("click", ()=>{
    spawnLoop(POPUP_COUNT);
})

//空格键清空所有卡片
document.addEventListener("keydown", e=>{
    if(e.code === "Space"){
        clearAllNotes();
    }
})
</script>
</body>
</html>
